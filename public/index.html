<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arch Diagram</title>
<style>
  :root {
    --ui-bg: #ffffff;
    --ui-bg2: #f3f4f6;
    --ui-border: #e2e5ea;
    --ui-text: #1f2937;
    --ui-muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: rgba(37, 99, 235, .12);
    --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ui-text); background: var(--ui-bg); display: flex; flex-direction: column; overflow: hidden;
  }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* ---------- toolbar ---------- */
  #toolbar {
    display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--ui-border);
    background: var(--ui-bg); flex-wrap: wrap; min-height: 46px; z-index: 20; position: relative;
  }
  .menu-wrap { position: relative; }
  .menu {
    position: absolute; top: calc(100% + 4px); left: 0; min-width: 210px; background: var(--ui-bg); border: 1px solid var(--ui-border);
    border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 4px; display: flex; flex-direction: column; z-index: 30;
  }
  .menu button { border: 0; background: transparent; text-align: left; padding: 7px 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
  .menu button:hover { background: var(--ui-bg2); }
  .menu button small { color: var(--ui-muted); }
  .brand { font-weight: 700; margin-right: 8px; white-space: nowrap; }
  .brand small { font-weight: 400; color: var(--ui-muted); margin-left: 4px; }
  .tgroup { display: flex; gap: 2px; padding: 0 6px; border-left: 1px solid var(--ui-border); align-items: center; }
  .tbtn {
    border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 5px 8px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .tbtn:hover { background: var(--ui-bg2); border-color: var(--ui-border); }
  .tbtn svg { width: 16px; height: 16px; }
  .tbtn:disabled { opacity: .4; cursor: default; }
  #zoomLabel { min-width: 46px; text-align: center; color: var(--ui-muted); cursor: pointer; }
  #collab { margin-left: auto; display: flex; align-items: center; gap: 8px; min-width: 0; }
  #docName {
    border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 4px 6px; font-weight: 600;
    width: 220px; max-width: 24vw; min-width: 60px; text-overflow: ellipsis;
  }
  #docName:hover { border-color: var(--ui-border); }
  #docName:focus { border-color: var(--accent); outline: none; background: var(--ui-bg); }
  #connState { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; flex: none; }
  #connState.on { background: #16a34a; }
  #connState.off { background: var(--danger); }
  #peers { display: flex; align-items: center; }
  .peer {
    width: 26px; height: 26px; border-radius: 50%; color: #fff; font-size: 10px; font-weight: 700; flex: none; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; border: 2px solid var(--ui-bg); margin-left: -6px; user-select: none;
  }
  .peer:first-child { margin-left: 0; }
  .peer.me { box-shadow: 0 0 0 2px var(--accent-soft); }
  .peer.more { background: var(--ui-bg2); color: var(--ui-muted); cursor: default; }
  .tbtn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tbtn.primary:hover { background: var(--accent); border-color: var(--accent); filter: brightness(1.08); }
  #meMenu { left: auto; right: 0; padding: 10px; gap: 8px; min-width: 240px; }
  #meMenu label { display: flex; align-items: center; gap: 8px; }
  #meMenu label span { width: 44px; color: var(--ui-muted); }
  #meMenu input[type=text] { flex: 1; min-width: 0; border: 1px solid var(--ui-border); border-radius: 6px; padding: 4px 6px; }
  #toolbar a.tbtn { color: inherit; text-decoration: none; }

  /* ---------- main ---------- */
  main { flex: 1; display: flex; min-height: 0; }
  #stage { position: relative; flex: 1; overflow: hidden; outline: none; }
  #svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; }
  #svg .block { cursor: move; }
  #svg .frame-hit { cursor: move; }
  #svg.shift .block, #svg.shift .conn { cursor: crosshair; }
  #svg .link .hit { cursor: pointer; }
  #svg .seg-h { cursor: ns-resize !important; } #svg .seg-v { cursor: ew-resize !important; }
  #svg .conn, #svg .end-handle { cursor: grab; }
  #svg { cursor: grab; }
  #stage.panning #svg, #stage.panning #svg * { cursor: grab !important; }
  #stage.dragpan #svg, #stage.dragpan #svg * { cursor: grabbing !important; }
  .h-nw, .h-se { cursor: nwse-resize; } .h-ne, .h-sw { cursor: nesw-resize; }
  .h-n, .h-s { cursor: ns-resize; } .h-e, .h-w { cursor: ew-resize; }

  /* block content inside foreignObject */
  .bc {
    width: 100%; height: 100%; padding: 6px 10px; display: flex; gap: 8px; overflow: hidden; position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.25; word-break: break-word; pointer-events: none; user-select: none; box-sizing: border-box;
  }
  .bc .bt { min-width: 0; }
  .bc .bi { flex: none; display: flex; align-items: center; justify-content: center; line-height: 1; }
  .bc .bi-corner { position: absolute; left: 6px; top: 6px; }
  .bc p { margin: 0; }

  /* rich text editor overlay */
  #edWrap {
    position: absolute; transform-origin: 0 0; display: flex; padding: 6px 10px; overflow: hidden;
    background: rgba(255,255,255,.85); outline: 2px solid var(--accent); z-index: 4;
  }
  #edInner {
    outline: none; min-width: 20px; max-width: 100%; max-height: 100%; overflow: auto;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.25; word-break: break-word;
  }
  #edInner p { margin: 0; }
  #edBar {
    position: absolute; z-index: 6; display: flex; gap: 2px; align-items: center; padding: 3px; background: var(--ui-bg);
    border: 1px solid var(--ui-border); border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.12);
  }
  #edBar button { border: 0; background: transparent; border-radius: 5px; min-width: 26px; height: 26px; cursor: pointer; }
  #edBar button:hover { background: var(--ui-bg2); }
  #edBar select { height: 26px; border: 1px solid var(--ui-border); border-radius: 5px; background: var(--ui-bg); }
  #edBar input[type=color] { margin: 0 3px; }
  #edBar .sep { width: 1px; height: 18px; background: var(--ui-border); margin: 0 3px; }

  #hint {
    position: absolute; left: 10px; bottom: 8px; color: var(--ui-muted); font-size: 12px; pointer-events: none;
    background: rgba(255,255,255,.75); padding: 2px 8px; border-radius: 6px;
  }
  #toast {
    position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: #111827; color: #fff; padding: 6px 12px;
    border-radius: 8px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10;
  }
  #toast.show { opacity: .92; }

  /* ---------- collaboration ---------- */
  #cursors { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 4; }
  .rcursor { position: absolute; left: 0; top: 0; }
  .rcursor svg { display: block; filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
  .rcursor span { position: absolute; left: 12px; top: 16px; color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
  #loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px;
    background: rgba(255,255,255,.85); color: var(--ui-muted); font-size: 14px; z-index: 8; text-align: center; padding: 16px;
  }
  #loading b { color: var(--ui-text); font-size: 16px; }
  #loading a { color: var(--accent); }

  /* ---------- inspector ---------- */
  #side { width: 290px; flex: none; border-left: 1px solid var(--ui-border); background: var(--ui-bg); display: flex; flex-direction: column; min-height: 0; }
  #sideTabs { display: flex; gap: 2px; margin: 8px 12px 0; padding: 2px; background: var(--ui-bg2); border-radius: 8px; flex: none; }
  #sideTabs button { flex: 1; border: 0; background: transparent; border-radius: 6px; padding: 5px 0; cursor: pointer; color: #4b5563; }
  #sideTabs button.on { background: var(--ui-bg); color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  #sideTabs .cnt { font-size: 11px; color: var(--ui-muted); margin-left: 2px; }
  .panel { flex: 1; overflow-y: auto; padding: 10px 12px 40px; min-height: 0; }
  .panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ui-muted); margin: 14px 0 6px; }
  .panel h3:first-child { margin-top: 2px; }
  .row { display: grid; grid-template-columns: 96px 1fr; gap: 6px; align-items: center; margin: 4px 0; }
  .row > span { color: var(--ui-muted); font-size: 12px; }
  .row input[type=text], .row input[type=number], .row select, .row textarea {
    width: 100%; padding: 4px 6px; border: 1px solid var(--ui-border); border-radius: 6px; background: var(--ui-bg); min-width: 0;
  }
  .color { display: inline-flex; align-items: center; gap: 8px; justify-self: start; cursor: pointer; }
  .color input[type=color], #edBar input[type=color] {
    -webkit-appearance: none; appearance: none; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 6px;
    background: none; cursor: pointer; box-shadow: 0 0 0 1px rgba(0,0,0,.14), 0 1px 2px rgba(0,0,0,.08); flex: none;
  }
  .color input[type=color]::-webkit-color-swatch-wrapper, #edBar input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  .color input[type=color]::-webkit-color-swatch, #edBar input[type=color]::-webkit-color-swatch { border: 0; border-radius: 6px; }
  .color input[type=color]::-moz-color-swatch, #edBar input[type=color]::-moz-color-swatch { border: 0; border-radius: 6px; }
  .color input[type=color]:hover, #edBar input[type=color]:hover { box-shadow: 0 0 0 1px rgba(0,0,0,.14), 0 0 0 3px var(--accent-soft); }
  .color .hex { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--ui-muted); text-transform: uppercase; }
  .row input[type=checkbox] { justify-self: start; }
  .btns { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
  .btn {
    border: 1px solid var(--ui-border); background: var(--ui-bg); border-radius: 6px; padding: 4px 9px; cursor: pointer;
  }
  .btn:hover { background: var(--ui-bg2); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.danger { color: var(--danger); }
  .seg { display: inline-flex; gap: 2px; padding: 2px; background: var(--ui-bg2); border-radius: 8px; justify-self: start; }
  .seg button {
    border: 0; background: transparent; border-radius: 6px; height: 26px; min-width: 30px; padding: 0 5px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; color: #4b5563;
  }
  .seg button:hover { background: rgba(255,255,255,.7); color: var(--ui-text); }
  .seg button.on { background: var(--ui-bg); color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.04); }
  .seg.plain { background: transparent; padding: 0; }
  .seg.plain button:hover { background: var(--ui-bg2); }
  .seg.plain button.on { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .seg.grid { display: grid; grid-template-columns: repeat(7, 1fr); width: 100%; }
  .seg.grid button { min-width: 0; padding: 0; }
  .row.stack { grid-template-columns: 1fr; gap: 3px; }
  .conn-item { border: 1px solid var(--ui-border); border-radius: 8px; padding: 6px 8px; margin: 5px 0; }
  .conn-item:hover { border-color: var(--accent); background: var(--accent-soft); }
  .conn-head { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; font-size: 12px; }
  .conn-dir { color: var(--accent); font-weight: 700; }
  .conn-other { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conn-head select { border: 1px solid var(--ui-border); border-radius: 6px; background: var(--ui-bg); padding: 1px 4px; font-size: 12px; max-width: 110px; }
  .conn-ctl { display: flex; align-items: center; gap: 8px; }
  .conn-ctl input[type=text] { flex: 1; min-width: 0; padding: 4px 6px; border: 1px solid var(--ui-border); border-radius: 6px; background: var(--ui-bg); }
  .conn-ctl .chk { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; color: var(--ui-muted); cursor: pointer; }
  .icon-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin: 4px 0 6px; }
  .icon-grid button {
    border: 1px solid var(--ui-border); background: var(--ui-bg); border-radius: 5px; height: 30px; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center; color: #374151;
  }
  .icon-grid button.on { border-color: var(--accent); background: var(--accent-soft); }
  .icon-grid svg { width: 18px; height: 18px; }
  .muted { color: var(--ui-muted); }
  .kbd { font-family: ui-monospace, Menlo, monospace; font-size: 11px; background: var(--ui-bg2); border: 1px solid var(--ui-border); border-radius: 4px; padding: 0 4px; }
  ul.tips { padding-left: 16px; margin: 6px 0; color: var(--ui-muted); }
  .flow-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 1px solid var(--ui-border); background: var(--ui-bg); border-radius: 8px; padding: 7px 9px; margin: 5px 0; cursor: pointer; }
  .flow-item:hover { border-color: var(--accent); background: var(--accent-soft); }
  .flow-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .flow-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .flow-item .muted { font-size: 12px; }
  .step { display: flex; align-items: flex-start; gap: 6px; border: 1px solid var(--ui-border); border-radius: 8px; padding: 6px 6px 6px 4px; margin: 5px 0; background: var(--ui-bg); }
  .step:hover, .step.hl { border-color: var(--accent); }
  .step.sel { background: var(--accent-soft); }
  .step.drop-before { box-shadow: 0 -3px 0 var(--accent); } .step.drop-after { box-shadow: 0 3px 0 var(--accent); }
  .step.dragging { opacity: .4; }
  .step-grip { cursor: grab; color: var(--ui-muted); padding: 2px 1px; user-select: none; line-height: 18px; letter-spacing: -2px; }
  .step-num { flex: none; min-width: 20px; height: 20px; border-radius: 10px; color: #fff; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px; }
  .step-body { flex: 1; min-width: 0; }
  .step-el { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 20px; cursor: pointer; }
  .step-body textarea { width: 100%; margin-top: 3px; padding: 3px 6px; border: 1px solid var(--ui-border); border-radius: 6px; background: var(--ui-bg); font: inherit; font-size: 12px; resize: vertical; min-height: 26px; }
  .step-del { border: 0; background: transparent; color: var(--ui-muted); cursor: pointer; border-radius: 5px; padding: 1px 5px; line-height: 18px; }
  .step-del:hover { color: var(--danger); background: var(--ui-bg2); }
  #recBar {
    position: absolute; left: 50%; top: 10px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; z-index: 5;
    background: #111827; color: #fff; padding: 6px 8px 6px 12px; border-radius: 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.18);
  }
  #recBar .dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; animation: recBlink 1.2s infinite; }
  #recBar button { border: 0; background: #fff; color: #111827; border-radius: 6px; padding: 3px 10px; cursor: pointer; font-weight: 600; }
  @keyframes recBlink { 50% { opacity: .25; } }
  #svg.recording .block, #svg.recording .link .hit { cursor: copy !important; }
  #svg .fstep { cursor: pointer; }
  ul.tips li { margin: 3px 0; }

  /* ---------- dialogs ---------- */
  dialog { border: 1px solid var(--ui-border); border-radius: 12px; padding: 0; width: min(560px, calc(100vw - 32px)); box-shadow: 0 20px 50px rgba(0,0,0,.2); }
  dialog::backdrop { background: rgba(17,24,39,.25); }
  .dlg-head { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--ui-border); font-weight: 600; }
  .dlg-head button { margin-left: auto; }
  .dlg-body { padding: 8px 16px 12px; max-height: 70vh; overflow: auto; }
  #settingsDlg { width: min(1180px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
  #settingsBody { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 24px; max-height: none; overflow: visible; padding: 4px 18px 14px; }
  #settingsBody .row { grid-template-columns: 1fr auto; margin: 3px 0; min-height: 28px; }
  #settingsBody .row input[type=number], #settingsBody .row select { width: 118px; }
  #settingsBody .row input[type=checkbox] { justify-self: end; }
  #settingsBody .color { justify-self: end; flex-direction: row-reverse; }
  #settingsBody .seg { justify-self: end; }
  #settingsBody .row.stack { grid-template-columns: 1fr; }
  #settingsBody .row.stack .seg { justify-self: stretch; }
  @media (max-width: 1000px) { #settingsBody { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .dlg-foot { display: flex; gap: 6px; padding: 10px 16px; border-top: 1px solid var(--ui-border); justify-content: flex-end; flex-wrap: wrap; }
  .dlg-body h4 { margin: 14px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ui-muted); }
  table.keys { border-collapse: collapse; width: 100%; }
  table.keys td { padding: 4px 6px; border-bottom: 1px solid var(--ui-bg2); vertical-align: top; }
  table.keys td:first-child { white-space: nowrap; width: 40%; }

  @media (max-width: 760px) {
    #side { width: 220px; }
    .tbtn .lbl { display: none; }
  }
</style>
</head>
<body>
<header id="toolbar">
  <div class="brand">Arch Diagram<small id="verLabel"></small></div>
  <div class="tgroup">
    <button class="tbtn" data-cmd="new" title="Create a new shared diagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 12v6M9 15h6"/></svg><span class="lbl">New</span></button>
    <button class="tbtn" data-cmd="open" title="Import a JSON file into this diagram (Ctrl/Cmd+O)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="lbl">Import</span></button>
    <button class="tbtn" data-cmd="save" title="Download as a JSON file (Ctrl/Cmd+Shift+S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg><span class="lbl">Download</span></button>
    <div class="menu-wrap">
      <button class="tbtn" data-cmd="exportMenu" title="Export the diagram as an image or PDF"><span class="lbl">Export</span> ▾</button>
      <div class="menu" id="exportMenu" hidden>
        <button data-cmd="exportPng">PNG image <small>high resolution</small></button>
        <button data-cmd="exportPdf">PDF document <small>high resolution</small></button>
        <button data-cmd="exportSvg">SVG image <small>vector</small></button>
      </div>
    </div>
  </div>
  <div class="tgroup">
    <button class="tbtn" data-cmd="addBlock" title="Add block (or double-click canvas)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 9v6M9 12h6"/></svg><span class="lbl">Block</span></button>
    <button class="tbtn" data-cmd="addFrame" title="Add frame (around the selected blocks, if any)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="3 3"/><path d="M7 7h5"/></svg><span class="lbl">Frame</span></button>
    <button class="tbtn" data-cmd="undo" title="Undo (Ctrl/Cmd+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="tbtn" data-cmd="redo" title="Redo (Ctrl/Cmd+Shift+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    <button class="tbtn" data-cmd="delete" title="Delete selection (Del)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
  </div>
  <div class="tgroup">
    <button class="tbtn" data-cmd="zoomOut" title="Zoom out (-)">−</button>
    <span id="zoomLabel" title="Reset zoom to 100%">100%</span>

function connectorsSection(b) {

/* Rasterize the SVG export at settings.canvas.exportScale, kept within the
   browser's canvas limits (and a pixel budget for very large diagrams) */
async function exportCanvas(maxPixels) {
  const r = buildExportSvg();
  if (!r) return null;
  let k = clamp(num(settings.canvas.exportScale, 3), 1, 8);
  k = Math.min(k, 16000 / r.w, 16000 / r.h, Math.sqrt(maxPixels / (r.w * r.h)));
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(r.svg);
  await img.decode();
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(r.w * k)); cv.height = Math.max(1, Math.round(r.h * k));
  const ctx = cv.getContext('2d');
  ctx.fillStyle = settings.canvas.background;
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(img, 0, 0, cv.width, cv.height);
  return { cv, w: r.w, h: r.h, k };
}

}

/* A one-page PDF: the page has the diagram's size (1 px = 0.75 pt) and holds
   the high-resolution raster as a lossless (Flate) RGB image */
async function exportPdf() {
  try {
    const r = await exportCanvas(40e6);
    if (!r) { toast('Nothing to export'); return; }
    const { cv } = r, W = cv.width, H = cv.height;
    const px = cv.getContext('2d').getImageData(0, 0, W, H).data;
    const rgb = new Uint8Array(W * H * 3);
    for (let i = 0, j = 0; i < px.length; i += 4, j += 3) { rgb[j] = px[i]; rgb[j + 1] = px[i + 1]; rgb[j + 2] = px[i + 2]; }
    const img = new Uint8Array(await new Response(new Blob([rgb]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer());
    const pw = f1(r.w * 0.75), ph = f1(r.h * 0.75);
    const pdfStr = v => '(' + String(v).replace(/[^\x20-\x7e]/g, '?').replace(/([\\()])/g, '\\$1') + ')';
    const content = `q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
    const enc = new TextEncoder(), parts = [], offsets = [];
    let len = 0;
    const put = x => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); len += b.length; };
    const obj = (n, body, stream) => {
      offsets[n] = len;
      put(`${n} 0 obj\n${body}\n`);
      if (stream) { put('stream\n'); put(stream); put('\nendstream\n'); }
      put('endobj\n');
    };
    put('%PDF-1.4\n%\xe2\xe3\xcf\xd3\n');
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
    obj(3, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
    obj(4, `<< /Type /XObject /Subtype /Image /Width ${W} /Height ${H} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /FlateDecode /Length ${img.length} >>`, img);
    obj(5, `<< /Length ${content.length} >>`, enc.encode(content));
    obj(6, `<< /Title ${pdfStr(exportName('').slice(0, -1))} /Creator ${pdfStr(APP_INFO.name + ' ' + APP_INFO.version)} /Producer ${pdfStr(APP_INFO.github)} >>`);
    const xref = len;
    let x = `xref\n0 7\n0000000000 65535 f \n`;
    for (let n = 1; n <= 6; n++) x += String(offsets[n]).padStart(10, '0') + ' 00000 n \n';
    put(x + `trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
    downloadBlob(exportName('pdf'), new Blob(parts, { type: 'application/pdf' }));
    toast(`PDF exported: ${W} × ${H} px image`);
  } catch (err) { toast('PDF export failed: ' + err.message, true); }
}

/* =====================================================================
   Collaboration: the shared diagram, real-time sync and presence.
   The server keeps the diagram and applies element-level operations in
   the order they arrive (last writer wins). Every client diffs its doc
   against `base` (what the server has plus what this client already sent)
   and sends the difference as operations; the server acks them and relays
   them to the others. A remote change to something this client changed
   and has not had acked yet is skipped: ours reaches the server later and
   wins there too, so all clients end up with the same diagram.
   ===================================================================== */
const DIAGRAM_ID = (location.pathname.match(/^\/d\/([A-Za-z0-9_-]{8,64})\/?$/) || [])[1] || null;
const PEER_COLORS = ['#e11d48', '#2563eb', '#059669', '#d97706', '#7c3aed', '#0891b2', '#db2777', '#65a30d', '#ea580c', '#4f46e5'];

let base = null;          // { blocks: Map(id -> json), …, order: { blocks: [ids], … }, settings: json, name }
let inflight = [];        // sent batches waiting for an ack: { n, keys, ops }
const pending = new Map(); // key -> number of unacked ops touching it
let opSeq = 0, syncTimer = null;
const peers = new Map();  // cid -> { user, cursor, sel }
let me = loadMe();

function loadMe() {
  let u = null;
  try { u = JSON.parse(storageGet('archdiagram.user') || 'null'); } catch (e) { u = null; }
  if (!u || typeof u.name !== 'string' || !/^#[0-9a-f]{6}$/i.test(u.color || '')) {
    u = { name: 'Guest ' + Math.floor(100 + Math.random() * 900), color: PEER_COLORS[Math.floor(Math.random() * PEER_COLORS.length)] };
    storageSet('archdiagram.user', JSON.stringify(u));
  }
  return u;
}

function takeBase(src) {
  const b = { order: {}, settings: JSON.stringify(settings), name: docName };
  for (const c of COLLS) {
    const list = Array.isArray(src[c]) ? src[c] : [];
    b[c] = new Map(list.map(o => [o.id, JSON.stringify(o)]));
    b.order[c] = list.map(o => o.id);
  }
  return b;
}

/* operations that turn `base` into the current doc; `base` is moved along */
function diffOps() {
  const ops = [];
  for (const c of COLLS) {
    const bm = base[c], cur = doc[c], ids = new Set();
    for (const o of cur) {
      ids.add(o.id);
      const s = JSON.stringify(o), prev = bm.get(o.id);
      if (prev === s) continue;
      bm.set(o.id, s);
      if (prev === undefined) { ops.push({ o: 'add', c, v: JSON.parse(s) }); continue; }
      const p = JSON.parse(prev), now = JSON.parse(s), f = {};
      let any = false;
      for (const k of new Set([...Object.keys(p), ...Object.keys(now)])) {
        if (k === 'id' || JSON.stringify(p[k]) === JSON.stringify(now[k])) continue;
        f[k] = k in now ? now[k] : null;
        any = true;
      }
      if (any) ops.push({ o: 'set', c, id: o.id, f });
    }
    for (const id of [...bm.keys()]) if (!ids.has(id)) { bm.delete(id); ops.push({ o: 'del', c, id }); }
    // the server appends new elements; send the order only when that is not what we have
    const expect = base.order[c].filter(id => ids.has(id)), known = new Set(expect);
    for (const o of cur) if (!known.has(o.id)) expect.push(o.id);
    const order = cur.map(o => o.id);
    if (expect.join('\n') !== order.join('\n')) ops.push({ o: 'order', c, ids: order });
    base.order[c] = order;
  }
  const st = JSON.stringify(settings);
  if (st !== base.settings) { base.settings = st; ops.push({ o: 'settings', v: JSON.parse(st) }); }
  if (docName !== base.name) { base.name = docName; ops.push({ o: 'name', v: docName }); }
  return ops;
}
function opKeys(op) {
  switch (op.o) {
    case 'add': return [op.c + ':' + op.v.id];
    case 'del': return [op.c + ':' + op.id];
    case 'set': return Object.keys(op.f).map(k => op.c + ':' + op.id + '.' + k);
    case 'order': return ['order:' + op.c];
    default: return [op.o];
  }
}

function scheduleSync() {
  if (!syncTimer) syncTimer = setTimeout(flushSync, 40);
}
function flushSync() {
  clearTimeout(syncTimer); syncTimer = null;
  if (!wsReady || !base) return;
  const ops = diffOps();
  if (!ops.length) return;
  const keys = ops.flatMap(opKeys);
  for (const k of keys) pending.set(k, (pending.get(k) || 0) + 1);
  const n = ++opSeq;
  inflight.push({ n, keys, ops });
  ws.send(JSON.stringify({ t: 'ops', n, ops }));
}
function onAck() {
  const b = inflight.shift();
  if (!b) return;
  for (const k of b.keys) { const v = pending.get(k) - 1; if (v > 0) pending.set(k, v); else pending.delete(k); }
}

/* Apply operations to the local doc. Remote ones respect pending local
   changes and move `base` along; replayed ones (our own, after a reconnect)
   are applied as they are and sent again by the next sync. */
function applyOps(ops, remote) {
  if (remote) flushSync(); // our unsent edits go first, so the pending rule covers them
  const isPending = k => remote && pending.has(k);
  let changed = false, inspTouched = false, nameChanged = false;
  for (const op of ops) {
    if (!op || typeof op !== 'object') continue;
    if (op.o === 'settings') {
      if (isPending('settings') || !op.v || typeof op.v !== 'object') continue;
      settings = deepMerge(DEFAULT_SETTINGS, op.v);
      if (remote) base.settings = JSON.stringify(settings);
      changed = true; continue;
    }
    if (op.o === 'name') {
      if (isPending('name')) continue;
      docName = String(op.v ?? '').slice(0, 200) || 'Untitled diagram';
      if (remote) base.name = docName;
      nameChanged = true; continue;
    }
    const c = op.c;
    if (!COLLS.includes(c)) continue;
    if (op.o === 'order') {
      if (isPending('order:' + c) || !Array.isArray(op.ids)) continue;
      doc[c] = reorderList(doc[c], op.ids);
      if (remote) base.order[c] = doc[c].map(o => o.id);
      changed = true; continue;
    }
    const id = op.o === 'add' ? op.v && op.v.id : op.id;
    if (typeof id !== 'string' || isPending(c + ':' + id)) continue;
    const list = doc[c], i = list.findIndex(o => o.id === id);
    if (op.o === 'del') {
      if (i >= 0) list.splice(i, 1);
      if (remote) { base[c].delete(id); base.order[c] = base.order[c].filter(x => x !== id); }
      if (sel.delete(id)) inspTouched = true;
      if (editingId === id) cancelEdit();
      if (c === 'flows' && activeFlow === id) { activeFlow = null; recording = false; }
      changed = true; continue;
    }
    const fields = op.o === 'add' ? op.v : op.f;
    if (!fields || typeof fields !== 'object' || (op.o === 'set' && i < 0)) continue;
    const el = i >= 0 ? list[i] : null;
    const merged = op.o === 'set' ? clone(el) : {};
    for (const [k, v] of Object.entries(fields)) {
      if (k === '__proto__') continue;
      if (el && isPending(c + ':' + id + '.' + k)) { if (k in el) merged[k] = clone(el[k]); else delete merged[k]; continue; }
      if (v === null) delete merged[k]; else merged[k] = v;
    }
    merged.id = id;
    const norm = NORM[c](merged);
    if (el) { for (const k of Object.keys(el)) delete el[k]; Object.assign(el, norm); } // in place: a drag may hold it
    else list.push(norm);
    if (remote) {
      base[c].set(id, JSON.stringify(el || norm));
      if (!el) base.order[c].push(id);
    }
    if (sel.has(id) || c === 'flows') inspTouched = true;
    changed = true;
  }
  if (changed) {
    bmap = new Map(doc.blocks.map(b => [b.id, b]));
    dropDangling();
    bmap = new Map(doc.blocks.map(b => [b.id, b]));
    if (activeFlow && !flowById(activeFlow)) { activeFlow = null; recording = false; inspTouched = true; }
    render();
    if (inspTouched) refreshInspectorSoon();
  }
  if (nameChanged) { updateTitle(); rememberRecent(); }
}

/* don't rebuild the side panel under the user's fingers */
let inspStale = false;
function refreshInspectorSoon() {
  const a = document.activeElement;
  if (a && $('#side').contains(a) && a.matches('input,textarea,select,[contenteditable]')) { inspStale = true; return; }
  inspStale = false;
  refreshInspector();
}
$('#side').addEventListener('focusout', () => setTimeout(() => { if (inspStale) refreshInspectorSoon(); }, 0));

/* ---------- connection ---------- */
function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/${DIAGRAM_ID}`);
  ws.onopen = () => { retryMs = 500; ws.send(JSON.stringify({ t: 'hello', user: me })); };
  ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (err) { return; } onMessage(m); };
  ws.onclose = async () => {
    const was = wsReady;
    wsReady = false;
    peers.clear(); renderPeers(); render();
    setConn(false);
    if (!everConnected) {
      // the diagram may simply not exist
      const res = await fetch('/api/diagrams/' + DIAGRAM_ID, { method: 'GET' }).catch(() => null);
      if (res && res.status === 404) { showLoading('<b>This diagram does not exist.</b><span>The link may be mistyped, or the diagram was removed.</span><a href="/">Create a new diagram</a>'); return; }
    }
    if (was) toast('Connection lost: reconnecting… Your changes are kept.', true);
    setTimeout(connect, retryMs);
    retryMs = Math.min(retryMs * 2, 10000);
  };
}
function setConn(on) {
  const s = $('#connState');
  s.className = on ? 'on' : 'off';
  s.title = on ? 'Connected: changes are saved and shared' : 'Offline: reconnecting. Your changes will be sent when the connection is back.';
}
function showLoading(html) {
  const l = $('#loading');
  if (html === null) { l.hidden = true; return; }
  l.innerHTML = html; l.hidden = false;
}

function onMessage(m) {
  switch (m.t) {
    case 'init': onInit(m); break;
    case 'ack': onAck(); break;
    case 'ops': if (base && Array.isArray(m.ops)) applyOps(m.ops, true); break;
    case 'join': peers.set(m.cid, { user: m.user, cursor: null, sel: [] }); renderPeers(); break;
    case 'leave': peers.delete(m.cid); renderPeers(); render(); break;
    case 'user': { const p = peers.get(m.cid); if (p) { p.user = m.user; renderPeers(); render(); } break; }
    case 'presence': {
      const p = peers.get(m.cid);
      if (!p) break;
      const selChanged = JSON.stringify(p.sel) !== JSON.stringify(m.sel || []);
      p.cursor = m.cursor; p.sel = m.sel || [];
      if (selChanged) render(); else renderCursors();
      break;
    }
  }
}

function onInit(m) {
  const first = !base;
  // after a reconnect: what we sent without an ack, and what we changed offline, goes again
  const replay = first ? [] : inflight.flatMap(b => b.ops).concat(diffOps());
  inflight = []; pending.clear();
  myCid = m.you;
  const d = m.doc || {};
  if (editingId && first) cancelEdit();
  settings = d.settings ? deepMerge(DEFAULT_SETTINGS, d.settings) : (first ? loadUserDefaults() : settings);
  docName = String(d.name || 'Untitled diagram');
  doc = normalizeDoc(d);
  // the raw server state is the base, so whatever normalising changed is sent back once
  base = takeBase(d);
  base.settings = JSON.stringify(d.settings || null);
  if (replay.length) applyOps(replay, false);
  bmap = new Map(doc.blocks.map(b => [b.id, b]));
  for (const id of [...sel]) if (!bmap.has(id) && !linkById(id) && !frameById(id)) sel.delete(id);
  if (activeFlow && !flowById(activeFlow)) { activeFlow = null; recording = false; }
  peers.clear();
  for (const p of m.peers || []) peers.set(p.cid, { user: p.user, cursor: p.cursor || null, sel: p.sel || [] });
  wsReady = true; everConnected = true;
  setConn(true); showLoading(null);
  if (first) {
    if (location.hash === '#demo' && !doc.blocks.length && !doc.links.length) {
      doc = demoDiagram();
      bmap = new Map(doc.blocks.map(b => [b.id, b]));
    }
    if (location.hash) history.replaceState(null, '', location.pathname);
    undoStack = []; redoStack = [];
    requestAnimationFrame(fitView);
  } else if (replay.length) toast('Reconnected: your offline changes were sent');
  lastPresence = '';
  updateTitle(); renderPeers(); rememberRecent();
  refreshInspector(); render();
  flushSync();
}

/* ---------- presence: pointers, selections, who is here ---------- */
let presenceTimer = null, lastPresence = '', myCursor = null;
function sendPresence() {
  if (presenceTimer || !wsReady) return;
  presenceTimer = setTimeout(() => {
    presenceTimer = null;
    if (!wsReady) return;
    const s = JSON.stringify({ t: 'presence', cursor: myCursor, sel: [...sel] });
    if (s !== lastPresence) { lastPresence = s; ws.send(s); }
  }, 50);
}
svg.addEventListener('pointermove', e => { const p = toWorld(e); myCursor = { x: r2(p.x), y: r2(p.y) }; sendPresence(); });
svg.addEventListener('pointerleave', () => { myCursor = null; sendPresence(); });

function peersSvg() {
  let s = '';
  const sw = 2 / view.k, pad = 5 / view.k;
  for (const p of peers.values()) {
    if (!p.sel || !p.sel.length) continue;
    const col = esc(p.user.color);
    let labelled = false;
    for (const id of p.sel) {
      const o = bmap.get(id) || frameById(id);
      if (o) {
        s += `<rect x="${f1(o.x - pad)}" y="${f1(o.y - pad)}" width="${f1(o.w + 2 * pad)}" height="${f1(o.h + 2 * pad)}" rx="${f1((o.radius || 0) + pad)}"
          fill="none" stroke="${col}" stroke-width="${sw}" stroke-dasharray="${6 / view.k} ${4 / view.k}" pointer-events="none"/>`;
        if (!labelled) {
          labelled = true;
          const fs = 11 / view.k;
          s += `<text x="${f1(o.x - pad)}" y="${f1(o.y - pad - 4 / view.k)}" font-size="${fs}" font-weight="600" fill="${col}" pointer-events="none"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">${esc(p.user.name)}</text>`;
        }
        continue;
      }
      const g = lastGeo.get(id);
      if (g) s += `<path d="${geoPath(g)}" fill="none" stroke="${col}" stroke-opacity=".35" stroke-width="${8 / view.k}" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/>`;
    }
  }
  return s;
}
function renderCursors() {
  let h = '';
  for (const p of peers.values()) {
    if (!p.cursor) continue;
    const x = view.x + p.cursor.x * view.k, y = view.y + p.cursor.y * view.k, col = esc(p.user.color);
    h += `<div class="rcursor" style="transform:translate(${f1(x)}px,${f1(y)}px)"><svg width="16" height="20" viewBox="0 0 16 20">
      <path d="M1 1l5.5 16 2.4-6.6L15.5 8z" fill="${col}" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg>
      <span style="background:${col}">${esc(p.user.name)}</span></div>`;
  }
  $('#cursors').innerHTML = h;
}
const initials = name => (String(name).trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2) || '?').toUpperCase();
function renderPeers() {
  const chip = (u, attrs, title) => `<span class="peer" ${attrs} style="background:${esc(u.color)}" title="${esc(title)}">${esc(initials(u.name))}</span>`;
  const list = [...peers.entries()];
  let h = chip(me, 'data-me="1"', me.name + ' (you): click to change your name and color').replace('class="peer"', 'class="peer me"');
  for (const [cid, p] of list.slice(0, 6)) h += chip(p.user, `data-peer="${esc(cid)}"`, p.user.name + (p.cursor ? ': click to go to their pointer' : ''));
  if (list.length > 6) h += `<span class="peer more" title="${esc(list.slice(6).map(([, p]) => p.user.name).join(', '))}">+${list.length - 6}</span>`;
  $('#peers').innerHTML = h;
}
$('#peers').addEventListener('click', e => {
  const c = e.target.closest('.peer');
  if (!c) return;
  if (c.dataset.me) {
    const menu = $('#meMenu');
    menu.hidden = !menu.hidden;
    if (!menu.hidden) { $('#meName').value = me.name; $('#meColor').value = me.color; $('#meName').focus(); $('#meName').select(); }
    return;
  }
  const p = peers.get(c.dataset.peer);
  if (p && p.cursor) {
    const r = svg.getBoundingClientRect();
    view.x = r.width / 2 - p.cursor.x * view.k; view.y = r.height / 2 - p.cursor.y * view.k;
    render();
  }
});
function onMeInput() {
  me = { name: $('#meName').value.trim().slice(0, 40) || me.name, color: $('#meColor').value };
  storageSet('archdiagram.user', JSON.stringify(me));
  renderPeers();
  if (wsReady) ws.send(JSON.stringify({ t: 'user', user: me }));
}
$('#meName').addEventListener('change', onMeInput);
$('#meColor').addEventListener('change', onMeInput);
$('#meName').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === 'Escape') { onMeInput(); $('#meMenu').hidden = true; } });
document.addEventListener('pointerdown', e => { if (!e.target.closest('#collab .menu-wrap')) $('#meMenu').hidden = true; });

/* ---------- name, link, recent list ---------- */
const docNameInput = $('#docName');
docNameInput.addEventListener('change', () => {
  const v = docNameInput.value.trim().slice(0, 200);
  if (v && v !== docName) { docName = v; markDirty(); rememberRecent(); }
  updateTitle();
});
docNameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') docNameInput.blur();
  if (e.key === 'Escape') { docNameInput.value = docName; docNameInput.blur(); }
});
async function shareLink() {
  const url = location.origin + '/d/' + DIAGRAM_ID;
  try { await navigator.clipboard.writeText(url); toast('Link copied. Anyone with the link can edit this diagram.'); }
  catch (err) { toast(url); }
}
function rememberRecent() {
  let list = [];
  try { list = JSON.parse(storageGet('archdiagram.recent') || '[]').filter(r => r && r.id && r.id !== DIAGRAM_ID); } catch (e) { list = []; }
  list.unshift({ id: DIAGRAM_ID, name: docName, at: Date.now() });
  storageSet('archdiagram.recent', JSON.stringify(list.slice(0, 30)));
}

/* =====================================================================
   Demo diagram & startup
   ===================================================================== */
function demoDiagram() {
  const B = (id, x, y, title, props = {}) => newBlock(x, y, Object.assign({ id, title }, props));
  const blocks = [
    B('web', 40, 60, '<b>Web app</b><br><font size="2" color="#6b7280">React SPA</font>', { icon: 'browser' }),
    B('mob', 40, 220, '<b>Mobile app</b><br><font size="2" color="#6b7280">iOS / Android</font>', { icon: 'mobile' }),
    B('gw', 320, 140, '<b>API Gateway</b>', { icon: 'shield', fill: '#eef2ff', stroke: '#6366f1', badge: 'NEW', badgeColor: '#6366f1' }),
    B('svcA', 600, 40, '<b>Orders</b><br><font size="2">service</font>', { icon: 'container' }),
    B('svcB', 600, 240, '<b>Billing</b><br><font size="2">service</font>', { icon: 'container', highlight: true, badge: '!', badgeColor: '#e53e3e' }),
    B('mq', 600, 420, '<b>Event bus</b>', { icon: 'queue', fill: '#fff7ed', stroke: '#ea580c', strokeStyle: 'dashed' }),
    B('db', 900, 40, '<b>Orders DB</b><br><font size="2">PostgreSQL</font>', { icon: 'database', iconPos: 'top', h: 90, fill: '#ecfdf5', stroke: '#059669' }),
    B('db2', 900, 240, '<b>Billing DB</b>', { icon: 'database', fill: '#ecfdf5', stroke: '#059669' })
  ];
  const L = (from, to, props = {}) => newLink({ block: from, side: 'auto' }, { block: to, side: 'auto' }, props);
  const links = [
    L('web', 'gw', { label: 'HTTPS' }),
    L('mob', 'gw', { label: 'HTTPS' }),
    L('gw', 'svcA', { endEnd: 'open', startConn: 'circle', connColor: '#6366f1' }),
    L('gw', 'svcB', { endEnd: 'open', startConn: 'circle', connColor: '#6366f1' }),
    L('svcA', 'db', { endEnd: 'arrow-wide', endConn: 'square', connColor: '#059669' }),
    L('svcB', 'db2', { endEnd: 'arrow-wide', endConn: 'square', connColor: '#059669' }),
    L('svcA', 'mq', { route: 'poly', style: 'dashed', color: '#ea580c', endEnd: 'triangle', label: 'events' }),
    L('mq', 'svcB', { route: 'curve', style: 'dashed', color: '#ea580c', endEnd: 'circle-filled', startEnd: 'diamond' })
  ];
  const flows = [{
    id: 'f-order', name: 'Place an order', color: FLOW_COLOR,
    description: 'A customer places an order in the web app; billing is triggered asynchronously.',
    steps: [
      { ref: 'web', description: 'Customer submits the cart' },
      { ref: links[0].id, description: 'POST /orders over HTTPS' },
      { ref: 'gw', description: 'Authenticates and routes the request' },
      { ref: 'svcA', description: 'Validates and creates the order' },
      { ref: 'db', description: 'Order is stored' },
      { ref: 'mq', description: 'OrderCreated event is published' },
      { ref: 'svcB', description: 'Charges the customer' },
      { ref: 'svcA', description: 'Marks the order as paid' }
    ]
  }];
  const frames = [newFrame(570, -10, 520, 520, { id: 'fr-backend', name: 'Backend' })];
  return { blocks, links, flows, frames };
}

function init() {
  $('#verLabel').textContent = 'v' + APP_INFO.version;
  $('#ghLink').href = APP_INFO.github;
  if (!DIAGRAM_ID) { location.replace('/'); return; }
  updateTitle(); renderPeers();
  refreshInspector(); render();
  connect();
}
init();
